<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>GOUAL RUN favela</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Character } from '../street/rig.js?v=3';
import { loadFavela, makeSky, makeClouds, makeFavela, makeBallonDor } from './favela.js';
const V3 = THREE.Vector3, q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#c'), antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(innerWidth / innerHeight < 0.8 ? 70 : 56, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 5.2, 10.5); camera.lookAt(0, 2.6, -18);
const { T, meta } = await loadFavela(renderer);
scene.add(makeSky(T, meta), makeClouds(T, meta));
scene.fog = new THREE.Fog('#c3dcea', 80, 420);
// light: warm low morning sun from the left, cool sky fill = bluish shadows
scene.add(new THREE.HemisphereLight('#bfe0ff', '#d9a87c', 1.1));
const sun = new THREE.DirectionalLight('#ffdcae', 3.2); sun.position.set(-30, 26, -14); sun.target.position.set(0, 0, -20); sun.position.add(sun.target.position);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 50, bottom: -50, near: 1, far: 160 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const env0 = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environment = env0; scene.environmentIntensity = 0.35;
const world = makeFavela(scene, T, meta);
for (let i = -1; i < 6; i++) world.segment(i);
// hero with the Ballon d'Or raised
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cr7 = await loader.loadAsync('../street/models/cr7.glb');
const ch = new Character(cr7.scene, { kind: 'valve', height: 1.87 });
ch.model.traverse(o => { if (o.isMesh) { o.castShadow = true; const col = { texture_6: '#f2f2f2', texture_7: '#1b1b1b', texture_8: '#f2f2f2' }[o.material.name]; if (col) { o.material = o.material.clone(); o.material.map = null; o.material.color.set(col); } } });
scene.add(ch.root); ch.root.rotation.y = Math.PI;
for (let i = 0; i < 40; i++) ch.animate({ dt: 1 / 60, speed: 11, grounded: true });
ch.rot('rArm', new V3(1, 0, 0), -2.75); ch.rot('rFore', new V3(1, 0, 0), -0.35); ch.root.updateMatrixWorld(true);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const ball = makeBallonDor(env); ball.position.copy(ch.bones.rHand.getWorldPosition(new V3())); ball.position.y -= 0.06; scene.add(ball);
// post: soft bloom, MSAA
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.28, 0.5, 0.88)); composer.addPass(new OutputPass());
if (q.has('orbit')) { camera.position.set(+q.get('x') || 0, +q.get('y') || 5.2, +q.get('z') || 10.5); camera.lookAt(+q.get('lx') || 0, +q.get('ly') || 2.6, +q.get('lz') || -18); }
composer.render(); window.__ready = true;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); composer.render(); });
</script>
</body>
</html>
